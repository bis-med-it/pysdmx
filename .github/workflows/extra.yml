name: Extra

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} • py${{ matrix.python-version }} • extra:${{ matrix.extra }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]
        extra: [noextra,json,dc,vtl,data,xml,xml-data]
        include:
          - extra: noextra
            marker: noextra
            extras_to_install: ""
          - extra: json
            marker: json
            extras_to_install: "json"
          - extra: dc
            marker: dc
            extras_to_install: "dc"
          - extra: vtl
            marker: vtl
            extras_to_install: "vtl"
          - extra: data
            marker: data
            extras_to_install: "data"
          - extra: xml
            marker: xml
            extras_to_install: "xml"
          - extra: xml-data
            marker: xml_data
            extras_to_install: "xml data"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install deps (${{ matrix.extras_to_install }})
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.extras_to_install }}" ]; then
            for e in ${{ matrix.extras_to_install }}; do
              poetry install --no-interaction --extras "$e" --without extras-dev
            done
          else
            poetry install --no-interaction --without extras-dev
          fi
      - name: Verify extras
        run: |
          poetry run python - <<'PY'
          import tomllib
          from importlib.util import find_spec
          from importlib.metadata import requires, PackageNotFoundError
          from packaging.requirements import Requirement

          # PyPI distribution name → importable module name, when they differ.
          MODULE_ALIAS = {"python-dateutil": "dateutil"}

          with open("pyproject.toml", "rb") as f:
              extras = tomllib.load(f)["project"]["optional-dependencies"]
          extras.pop("all", None)

          def mod(name: str) -> str:
              return MODULE_ALIAS.get(name, name.replace("-", "_"))

          def transitive(direct: set[str]) -> set[str]:
              seen, queue = set(), list(direct)
              while queue:
                  name = queue.pop()
                  if name in seen:
                      continue
                  seen.add(name)
                  try:
                      deps = requires(name) or []
                  except PackageNotFoundError:
                      continue
                  for r in deps:
                      req = Requirement(r)
                      if req.marker:
                          try:
                              if not req.marker.evaluate():
                                  continue
                          except Exception:
                              pass
                      if req.extras:
                          continue
                      queue.append(req.name)
              return seen

          selected = "${{ matrix.extras_to_install }}".split()
          all_pkgs = {Requirement(r).name for spec in extras.values() for r in spec}
          direct = {Requirement(r).name for e in selected for r in extras.get(e, [])}
          must = {mod(p) for p in transitive(direct) & all_pkgs}
          forbidden = {mod(p) for p in all_pkgs} - must

          ok = True
          for m in sorted(must):
              if not find_spec(m):
                  print(f"Missing: {m}"); ok = False
          for m in sorted(forbidden):
              if find_spec(m):
                  print(f"Unexpected: {m}"); ok = False
          raise SystemExit(0 if ok else 1)
          PY

      - name: Run tests (${{ matrix.marker }})
        run: poetry run pytest -m "${{ matrix.marker }}" --cov=pysdmx --cov-branch




